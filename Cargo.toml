[workspace]
members = ["crates/client", "crates/gameplay-core", "crates/protocol", "crates/server"]
default-members = ["crates/client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
publish = false

[workspace.dependencies]
burnhop-protocol = { path = "crates/protocol" }
renet = "=2.0.0"
renet_netcode = "=2.0.0"
burnhop-gameplay-core = { path = "crates/gameplay-core" }
# Native rendering plus Bevy UI/default font for the controls and fuel HUD.
bevy = { version = "=0.19.1", default-features = false, features = [
    "std", "async_executor", "multi_threaded", "bevy_log", "bevy_winit",
    "bevy_core_pipeline", "bevy_sprite_render", "bevy_ui_render", "default_font",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Keep our code quick to rebuild while optimizing engine dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
